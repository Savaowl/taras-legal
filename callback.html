<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taras Analytics: callback</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem">
<h1>Авторизация TikTok</h1>
<p id="msg">Ожидание ответа TikTok...</p>
<pre id="code" style="white-space:pre-wrap;word-break:break-all;background:#eee;padding:1rem;display:none"></pre>
<script>
var p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error");
if(c){document.getElementById("msg").textContent="Код получен. Скопируйте его целиком и вставьте в чат. Он одноразовый и действует недолго. Страница ничего никуда не отправляет.";var el=document.getElementById("code");el.textContent=c;el.style.display="block";}
else if(e){document.getElementById("msg").textContent="Ошибка: "+e+" "+(p.get("error_description")||"");}
else{document.getElementById("msg").textContent="Это страница возврата после входа в TikTok. Откройте её через вход.";}
</script></body></html>
